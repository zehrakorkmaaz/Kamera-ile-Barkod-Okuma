<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartCart</title><style>
:root{--ink:#172033;--blue:#3d66f5;--soft:#f2f5fb;--ok:#17895a;--warn:#ac5a00}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:25px max(24px,calc((100% - 1080px)/2));background:white;border-bottom:1px solid #e3e8f2;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;letter-spacing:1.5px;margin:0}main{max-width:1080px;margin:28px auto;padding:0 20px}.nav,.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;background:var(--blue);color:white;border-radius:9px;padding:11px 16px;font-weight:650;cursor:pointer}button.alt{background:white;color:var(--ink);border:1px solid #d8dfec}.screen{display:none}.screen.active{display:block}.card{background:#fff;border-radius:15px;padding:22px;margin-top:18px;box-shadow:0 4px 20px #22335c0b}.camera{position:relative;background:#111;border-radius:12px;overflow:hidden;max-width:900px;aspect-ratio:16/9}.camera img{width:100%;height:100%;object-fit:contain;display:block;transform:none}.target{position:absolute;inset:22% 12%;border:2px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px #0004;display:grid;place-items:end center;padding-bottom:12px;color:#fff;font-weight:600;text-shadow:0 1px 3px #000}.message{margin-top:15px;padding:13px;border-radius:9px;background:#edf2ff;transition:background .15s}.message small{opacity:.65;font-weight:700;font-size:12px;letter-spacing:.6px;margin-left:6px}.success{background:#e5f7ee;color:var(--ok)}.warning{background:#fff1de;color:var(--warn)}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:680px;margin-top:20px}label{font-weight:600;font-size:14px;display:grid;gap:6px}input{font:inherit;padding:10px;border:1px solid #cfd7e6;border-radius:8px;width:100%}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{text-align:left;padding:11px;border-bottom:1px solid #e3e8f2}#product-result{font-size:17px;line-height:1.65}@media(max-width:600px){form{grid-template-columns:1fr}header{align-items:flex-start;gap:14px;flex-direction:column}table{font-size:13px}}
</style></head><body>
<header><h1>SMARTCART</h1><nav class="nav"><button class="alt" data-page="home">Ana Sayfa</button><button class="alt" data-page="register">Ürün Tanıt</button><button class="alt" data-page="scan">Barkod Oku</button><button class="alt" data-page="products">Ürünler</button></nav></header>
<main>
<section id="home" class="screen active"><div class="card"><h2>Market ürünlerini kamerayla yönetin</h2><p>Mac kamerasından barkodu okutun, ürünü tanıtın veya mevcut kaydı bulun.</p><div class="actions"><button data-page="register">Ürün Tanıt</button><button data-page="scan">Barkod Oku</button><button data-page="products">Ürünler</button></div></div></section>
<section id="register" class="screen"><h2>Ürün Tanıt</h2><div class="card"><div class="camera"><img class="feed" alt="Kamera yayını"><div class="target">📷 Barkodu bu çerçeveye getirin</div></div><div class="message camera-message">Barkod aranıyor…</div><div id="register-existing"></div><form id="product-form"><label>Barkod<input name="barcode" required readonly aria-readonly="true" placeholder="Kameradan otomatik okunur"></label><label>Ürün adı<input name="name" required></label><label>Marka<input name="brand"></label><label>Kategori<input name="category"></label><label>Fiyat (TL)<input name="price" type="number" step="0.01" min="0"></label><label>Ağırlık<input name="weight" placeholder="Örn. 1050 g"></label><label class="full">Ürün fotoğrafı (isteğe bağlı)<input name="image" type="file" accept="image/*"></label><div class="full"><button>Ürünü Tanımla</button></div></form></div></section>
<section id="scan" class="screen"><h2>Barkod Oku</h2><div class="card"><div class="camera"><img class="feed" alt="Kamera yayını"><div class="target">Barkodu bu çerçeveye getirin</div></div><div class="message camera-message">Kamera başlatılıyor…</div><div id="product-result"></div></div></section>
<section id="products" class="screen"><h2>Ürünler</h2><div class="card"><input id="search" placeholder="Barkod veya ürün adıyla ara"><div style="overflow:auto"><table><thead><tr><th>Barkod</th><th>Ürün</th><th>Marka</th><th>Kategori</th><th>Fiyat</th><th>Ağırlık</th></tr></thead><tbody id="product-list"></tbody></table></div></div></section>
</main><script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s); let active='home', lastEvent=0, selectedBarcode='', editing=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return v==null?'—':Number(v).toLocaleString('tr-TR',{style:'currency',currency:'TRY'})}
async function startCamera(){const r=await fetch('/api/camera/start',{method:'POST'});const d=await r.json(); if(!r.ok){showCameraError(d.error);return false} $$('.feed').forEach(i=>i.src='/api/camera/stream?t='+Date.now());$$('.camera-message').forEach(e=>{e.textContent='Barkod aranıyor…';e.className='message camera-message'});return true}
function showCameraError(msg){$$('.camera-message').forEach(e=>{e.textContent=msg;e.className='message camera-message warning'})}
async function ignorePreviousScan(){try{const d=await (await fetch('/api/camera/status')).json();lastEvent=d.event_id}catch(_){}}
function fillForm(p){const f=$('#product-form');for(const k of ['barcode','name','brand','category','price','weight'])f.elements[k].value=p[k]??'';editing=!!p.id; selectedBarcode=p.barcode||''}
function resetRegistration(){const f=$('#product-form');f.reset();f.elements.barcode.value='';editing=false;selectedBarcode='';$('#register-existing').innerHTML='';}
async function handleBarcode(barcode,status){selectedBarcode=barcode;
  // The camera already looked the product up while confirming the scan, so use
  // that result and only fall back to /api/scan if it is missing.
  let d=status&&status.found!=null?{found:status.found,barcode,product:status.product}:null;
  if(!d){const r=await fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({barcode})});d=await r.json()}
  if(active==='register'){if(d.found){fillForm(d.product);$('#register-existing').innerHTML=`<div class="message warning">Bu barkoda ait ürün zaten kayıtlı. Bilgileri güncelleyebilirsiniz.</div>`}else{fillForm({barcode,name:'',brand:'',category:'',price:'',weight:''});$('#register-existing').innerHTML='<div class="message success">Barkod otomatik yazıldı. Ürün bilgilerini girip kaydedin.</div>'}}if(active==='scan'){ $('#product-result').innerHTML=d.found?`<div class="message success"><b>ÜRÜN BULUNDU</b><br>${esc(d.product.name)}<br>${esc(d.product.brand||'')}<br>${money(d.product.price)} · ${esc(d.product.weight||'')}<br>${esc(barcode)}</div>`:`<div class="message warning">Barkod okundu ancak ürün kayıtlı değil.<br><br><button id="introduce">Bu Ürünü Tanıt</button></div>`; if(!d.found)$('#introduce').onclick=()=>go('register',barcode)}}
// Live scanner state: the message and its tone come from real image analysis
// (sharpness, brightness, barcode size, confirmation progress), not from a
// fixed script, so the guidance always matches what the camera is seeing.
const STATE_TONE={PRODUCT_FOUND:'success',CONFIRMED:'success',PRODUCT_UNKNOWN:'warning',RESULT_CONFLICT:'warning',CANDIDATE:'',DETECTING:'',COOLDOWN:'',IDLE:'',READY:''};
function showState(d){if(d.error){showCameraError(d.error);return}
  const tone=STATE_TONE[d.state]??'', badge=d.scan&&d.scan.level&&d.state!=='IDLE'&&d.state!=='DETECTING'?` <small>${esc(d.scan.level)} · %${Math.round(d.scan.confidence)}</small>`:'';
  $$('.camera-message').forEach(e=>{e.innerHTML=esc(d.message||'Barkod aranıyor…')+badge;e.className='message camera-message '+tone})
  if(active==='register'&&(d.state==='DETECTING'||d.state==='CANDIDATE'||d.state==='IDLE')){
    $('#register-existing').innerHTML='';
  }}
async function poll(){
  if(active==='home'){setTimeout(poll,100);return}
  try{
    const d=await (await fetch('/api/camera/status',{cache:'no-store'})).json();
    showState(d);
    if(d.event_id>lastEvent){lastEvent=d.event_id;handleBarcode(d.barcode,d)}
  }catch(_){}
  // Run after the previous request finishes so status requests never pile up.
  setTimeout(poll,50);
}

async function listProducts(){const q=$('#search').value;const r=await fetch('/api/products?q='+encodeURIComponent(q));const ps=await r.json();$('#product-list').innerHTML=ps.map(p=>`<tr><td>${esc(p.barcode)}</td><td>${esc(p.name)}</td><td>${esc(p.brand)}</td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${esc(p.weight)}</td></tr>`).join('')||'<tr><td colspan="6">Henüz ürün yok.</td></tr>'}
async function go(page, barcode=''){active=page;$$('.screen').forEach(e=>e.classList.toggle('active',e.id===page));if(page==='register'){resetRegistration();if(barcode)fillForm({barcode,name:'',brand:'',category:'',price:'',weight:''});await startCamera();await ignorePreviousScan()}if(page==='scan'){ $('#product-result').innerHTML='';await startCamera();await ignorePreviousScan()}if(page==='products')listProducts()}
$$('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#search').oninput=listProducts;
$('#product-form').onsubmit=async e=>{e.preventDefault();const f=e.target, barcode=f.elements.barcode.value, fd=new FormData(f), url=editing?'/api/products/'+encodeURIComponent(barcode):'/api/products', method=editing?'PUT':'POST';const r=await fetch(url,{method,body:fd}),d=await r.json();if(!r.ok){$('#register-existing').innerHTML=`<div class="message warning">${esc(d.error)}</div>`;return}resetRegistration();$('#register-existing').innerHTML='<div class="message success">✓ Ürün başarıyla tanımlandı. Yeni barkodu kameraya gösterin.</div>';$$('.camera-message').forEach(e=>{e.textContent='📷 Barkodu kameraya gösterin';e.className='message camera-message'});};
poll();
</script></body></html>
